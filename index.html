<!--- Projeto Explorador de Paises --->
<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="styles.css">
     


<title>Explorador de Países</title>

<link rel="stylesheet" href="style.css">


</head>

<body>


<header>
    <h1>🌎 Explorador de Países</h1>
    <p>Pesquise um país e descubra suas informações.</p>
</header>

<main>

    <section class="busca">
        <input
            type="text"
            id="campo-pais"
            placeholder="Digite o nome de um país"
        >

        <button id="botao-buscar">Buscar</button>
    </section>

    <section id="mensagem"></section>

    <section id="resultado"></section>

</main>

<footer>
    <p>Projeto desenvolvido para o Bootcamp II</p>
</footer>

<script src="script.js"></script>


</body>
</html>
